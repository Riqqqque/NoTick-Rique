name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  legacy:
    name: Minecraft 1.20.1 and 1.21.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: .\gradlew.bat --no-daemon --console=plain buildAll

  modern:
    name: Minecraft 26.1.2 and 26.2
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - run: .\mc-modern-build\gradlew.bat -p mc-modern-build --no-daemon --console=plain buildAll

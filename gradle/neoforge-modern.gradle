def sharedSourceDir = rootProject.file("../src/main/java")
def sharedResourceDir = rootProject.file("../src/main/resources")
def modernResourceDir = rootProject.file("../modern/src/main/resources")
def generatedJavaDir = layout.buildDirectory.dir("generated/notick26/java")
def generatedResourceDir = layout.buildDirectory.dir("generated/notick26/resources")
def noTickProps = rootProject.ext.noTickProps
def minecraftVersion = rootProject.property(project.ext.modernMinecraftVersionProperty)
def neoForgeVersion = rootProject.property(project.ext.modernNeoForgeVersionProperty)
def neoForgeMinimumVersion = rootProject.property(project.ext.modernNeoForgeMinimumVersionProperty)
def modVersion = project.version.toString()
def releaseJarName = "NoTick-neoforge-${modVersion}-${minecraftVersion}.jar"

base {
    archivesName = "NoTick-neoforge"
}

dependencies {
    compileOnly "org.jetbrains:annotations:24.1.0"
}

tasks.register("preprocessNoTickJava") {
    inputs.dir(sharedSourceDir)
    outputs.dir(generatedJavaDir)

    doLast {
        def outputRoot = generatedJavaDir.get().asFile
        delete(outputRoot)
        outputRoot.mkdirs()

        fileTree(sharedSourceDir).matching { include "**/*.java" }.each { sourceFile ->
            def relativePath = sharedSourceDir.toPath().relativize(sourceFile.toPath()).toString()
            def outputFile = new File(outputRoot, relativePath)
            outputFile.parentFile.mkdirs()
            def processed = preprocessJava(sourceFile.readLines("UTF-8")).join(System.lineSeparator())
            outputFile.text = applyNoTickModernCompat(processed, minecraftVersion.toString()) + System.lineSeparator()
        }
    }
}

tasks.register("syncNoTickResources", Sync) {
    from(sharedResourceDir) {
        exclude "fabric.mod.json"
        exclude "META-INF/mods.toml"
        exclude "META-INF/neoforge.mods.toml"
        exclude "mixins.no_ticks.json"
        exclude "no_ticks.accesswidener"
        exclude "pack.mcmeta"
    }
    from(modernResourceDir) {
        expand([
                mod_id           : noTickProps.getProperty("mod.id"),
                mod_name         : noTickProps.getProperty("mod.display_name"),
                mod_version      : noTickProps.getProperty("mod.version"),
                mod_description  : noTickProps.getProperty("mod.description"),
                mod_author       : noTickProps.getProperty("mod.author"),
                mod_license      : noTickProps.getProperty("mod.license"),
                mod_github       : noTickProps.getProperty("mod.github"),
                mod_namespace    : noTickProps.getProperty("mod.namespace"),
                minecraft_version: minecraftVersion,
                neoforge_version : neoForgeVersion,
                neoforge_min_version: neoForgeMinimumVersion
        ])
    }
    into(generatedResourceDir)
}

sourceSets {
    main {
        java.setSrcDirs([generatedJavaDir])
        resources.setSrcDirs([generatedResourceDir])
    }
}

neoForge {
    version = neoForgeVersion

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument "--nogui"
        }
    }

    mods {
        no_ticks {
            sourceSet sourceSets.main
        }
    }
}

tasks.named("compileJava") {
    dependsOn(tasks.named("preprocessNoTickJava"))
    options.compilerArgs.addAll(["-Xlint:deprecation", "-Xlint:unchecked"])
}

tasks.named("processResources") {
    dependsOn(tasks.named("syncNoTickResources"))
}

tasks.named("jar", Jar) {
    archiveFileName = releaseJarName
}

tasks.named("sourcesJar", Jar) {
    dependsOn(tasks.named("preprocessNoTickJava"), tasks.named("syncNoTickResources"))
    archiveClassifier = "sources"
    archiveFileName = "NoTick-neoforge-${modVersion}-${minecraftVersion}-sources.jar"
}

tasks.register("verifyReleaseJar") {
    dependsOn(tasks.named("jar"))
    inputs.file(tasks.named("jar", Jar).flatMap { it.archiveFile })

    doLast {
        def jarFile = tasks.named("jar", Jar).get().archiveFile.get().asFile
        def requiredEntries = [
                "META-INF/neoforge.mods.toml",
                "mixins.no_ticks.json",
                "rique/notick/NoTick.class",
                "assets/notick/textures/mod_logo.png",
                "assets/notick/lang/en_us.json"
        ]
        def forbiddenEntries = [
                "fabric.mod.json",
                "META-INF/mods.toml",
                "no_ticks.accesswidener"
        ]

        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            requiredEntries.each { entry ->
                if (zip.getEntry(entry) == null) {
                    throw new GradleException("Release jar is missing ${entry}")
                }
            }
            forbiddenEntries.each { entry ->
                if (zip.getEntry(entry) != null) {
                    throw new GradleException("Release jar contains loader metadata from another build: ${entry}")
                }
            }

            def metadata = zip.getInputStream(zip.getEntry("META-INF/neoforge.mods.toml")).getText("UTF-8")
            [
                    "modId=\"${noTickProps.getProperty('mod.id')}\"",
                    "version=\"${modVersion}\"",
                    "versionRange=\"[${minecraftVersion}]\"",
                    "versionRange=\"[${neoForgeMinimumVersion},)\""
            ].each { expected ->
                if (!metadata.contains(expected)) {
                    throw new GradleException("Release metadata is missing ${expected}")
                }
            }
        }
    }
}

tasks.named("check") {
    dependsOn(tasks.named("verifyReleaseJar"))
}

def preprocessJava(List<String> lines) {
    def stack = []
    def output = []

    lines.each { line ->
        def trimmed = line.trim()

        if (trimmed.startsWith("#if ") && trimmed.contains("#endif")) {
            if (stack.isEmpty() || stack.every { it.active }) {
                output << preprocessInlineDefines(line)
            }
            return
        }

        if (trimmed.startsWith("#if ")) {
            def parentActive = stack.isEmpty() || stack.every { it.active }
            def active = parentActive && isNoTickDefineEnabled(trimmed.substring(4).trim())
            stack << [parentActive: parentActive, active: active, matched: active]
            return
        }

        if (trimmed.startsWith("#elif ")) {
            def frame = stack.last()
            if (!frame.parentActive || frame.matched) {
                frame.active = false
            } else {
                frame.active = isNoTickDefineEnabled(trimmed.substring(6).trim())
                frame.matched = frame.active
            }
            return
        }

        if (trimmed == "#else") {
            def frame = stack.last()
            frame.active = frame.parentActive && !frame.matched
            frame.matched = true
            return
        }

        if (trimmed.startsWith("#endif")) {
            def directiveIndex = line.indexOf("#endif")
            def suffix = line.substring(directiveIndex + "#endif".length())
            stack.remove(stack.size() - 1)
            if (!suffix.isBlank() && (stack.isEmpty() || stack.every { it.active })) {
                output << line.substring(0, directiveIndex) + suffix
            }
            return
        }

        if (stack.isEmpty() || stack.every { it.active }) {
            output << preprocessInlineDefines(line)
        }
    }

    if (!stack.isEmpty()) {
        throw new GradleException("Unclosed preprocessor block in NoTick source")
    }

    return output
}

def preprocessInlineDefines(String line) {
    def withElse = ~/#if\s+([A-Za-z0-9_]+)\s+(.*?)\s+#else\s+(.*?)\s+#endif/
    while (true) {
        def matcher = withElse.matcher(line)
        if (!matcher.find()) break
        def replacement = isNoTickDefineEnabled(matcher.group(1)) ? matcher.group(2) : matcher.group(3)
        line = matcher.replaceFirst(java.util.regex.Matcher.quoteReplacement(replacement))
    }

    def withoutElse = ~/#if\s+([A-Za-z0-9_]+)\s+(.*?)\s+#endif/
    while (true) {
        def matcher = withoutElse.matcher(line)
        if (!matcher.find()) break
        def replacement = isNoTickDefineEnabled(matcher.group(1)) ? matcher.group(2) : ""
        line = matcher.replaceFirst(java.util.regex.Matcher.quoteReplacement(replacement))
    }

    return line
}

def isNoTickDefineEnabled(String rawCondition) {
    def condition = rawCondition.trim()
    if (condition.startsWith("!")) {
        return !isNoTickDefineEnabled(condition.substring(1))
    }

    return [
            "NEO",
            "neo",
            "FORGELIKE",
            "forgelike",
            "AFTER_20_1",
            "after_20_1",
            "AFTER_21_1",
            "after_21_1",
            "NEWER_THAN_20_1",
            "newerthan_20_1"
    ].contains(condition)
}

def applyNoTickModernCompat(String source, String minecraftVersion) {
    def modernSource = source
            .replace("import net.minecraft.resources.ResourceLocation;", "import net.minecraft.resources.Identifier;")
            .replace("ResourceLocation", "Identifier")
            .replace("FMLLoader.getLoadingModList()", "FMLLoader.getCurrent().getLoadingModList()")
            .replace("source.hasPermission(2)", "source.permissions().hasPermission(new net.minecraft.server.permissions.Permission.HasCommandLevel(net.minecraft.server.permissions.PermissionLevel.GAMEMASTERS))")
            .replace("level.isClientSide", "level.isClientSide()")
            .replace(".location()", ".identifier()")
            .replace("new ChunkPos(pos)", "ChunkPos.containing(pos)")
            .replace("ChunkPos.asLong(", "ChunkPos.pack(")
            .replace("chunk.x + \", \" + chunk.z", "chunk.x() + \", \" + chunk.z()")
            .replace("center.x + x", "center.x() + x")
            .replace("center.z + z", "center.z() + z")
            .replace("chunkPos.x, chunkPos.z", "chunkPos.x(), chunkPos.z()")
            .replace("player.chunkPosition().x, player.chunkPosition().z", "player.chunkPosition().x(), player.chunkPosition().z()")
            .replace("displayClientMessage(Component.literal(getLoginWarningText()), false)", "sendSystemMessage(Component.literal(getLoginWarningText()))")

    if (minecraftVersion == "26.2") {
        modernSource = modernSource
                .replace("import net.minecraft.ChatFormatting;" + System.lineSeparator(), "")
                .replace("import net.minecraft.world.entity.monster.Slime;", "import net.minecraft.world.entity.monster.cubemob.Slime;")
                .replace(".withStyle(value ? ChatFormatting.GREEN : ChatFormatting.RED)", ".withStyle(net.minecraft.network.chat.Style.EMPTY.withColor(value ? 0x55FF55 : 0xFF5555))")
                .replace(".withStyle(ChatFormatting.AQUA, ChatFormatting.BOLD)", ".withStyle(net.minecraft.network.chat.Style.EMPTY.withColor(0x55FFFF).withBold(true))")
                .replace(".withStyle(ChatFormatting.WHITE, ChatFormatting.BOLD)", ".withStyle(net.minecraft.network.chat.Style.EMPTY.withColor(0xFFFFFF).withBold(true))")
                .replace(".withStyle(ChatFormatting.AQUA)", ".withStyle(net.minecraft.network.chat.Style.EMPTY.withColor(0x55FFFF))")
                .replace(".withStyle(ChatFormatting.WHITE)", ".withStyle(net.minecraft.network.chat.Style.EMPTY.withColor(0xFFFFFF))")
                .replace(".withStyle(ChatFormatting.GRAY)", ".withStyle(net.minecraft.network.chat.Style.EMPTY.withColor(0xAAAAAA))")
                .replace(".withStyle(ChatFormatting.DARK_GRAY)", ".withStyle(net.minecraft.network.chat.Style.EMPTY.withColor(0x555555))")
                .replace(".withStyle(ChatFormatting.RED)", ".withStyle(net.minecraft.network.chat.Style.EMPTY.withColor(0xFF5555))")
                .replace(".withStyle(ChatFormatting.GREEN)", ".withStyle(net.minecraft.network.chat.Style.EMPTY.withColor(0x55FF55))")
                .replace(".withStyle(ChatFormatting.YELLOW)", ".withStyle(net.minecraft.network.chat.Style.EMPTY.withColor(0xFFFF55))")
    }

    return modernSource
}
